# Legible Novelty — Stage 0 local development environment.
#
# Three services: postgres (session/app store), app (Node.js), mailpit (local
# email catcher). Everything is fully local and zero-cost. Connection details
# for postgres are driven entirely by environment variables so that swapping in
# a managed Postgres instance later is a config change, not a re-architecture.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # UTF-8 from day one: non-Latin scripts appear in module content from
      # launch, so this is not a "later" concern.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      # Persistent named volume so data survives container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Provisions the shadow (prisma migrate dev) and test databases on a
      # fresh data directory.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Exposed only to other services on the compose network, not the host.
    # (Add a `ports:` mapping here if you want direct host DB access for
    # debugging.)
    expose:
      - "5432"
    # Explicit healthcheck — check.sh's `docker compose up -d --wait postgres`
    # depends on this existing.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
      # Grace window for a COLD start. check.sh tears down and recreates the
      # volume on every run, so a full `initdb` PLUS provisioning the shadow and
      # test databases (./db/init) is paid on every single invocation, never
      # amortized. During `start_period`, failing probes do NOT count against
      # `retries`; a passing probe still flips the container to healthy the
      # instant it succeeds. The old 10s let those failed probes start counting
      # mid-init, so on Docker Desktop's WSL2 backend — where fresh-volume I/O is
      # measurably slower than a native Linux CI runner — a slow cold start could
      # exhaust the retry budget and report "did not become healthy" as an
      # intermittent race (observed to pass on a plain retry, i.e. hovering near
      # the old ~85s ceiling: 10s grace + 15×5s). 60s widens the grace to
      # comfortably cover a slow-volume cold start (new ceiling ~135s = 60s +
      # 15×5s) while a fast native start pays no penalty and a genuinely crashed
      # container still fails `--wait` immediately (an exited container is not
      # "slow", so it is reported at once regardless of this window).
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the project for live code reload during development...
      - .:/app
      # ...but layer a named volume over node_modules so the host mount does
      # not shadow the dependencies (and generated Prisma Client) that the
      # image built. Tradeoff: after changing dependencies you must rebuild
      # (`docker compose down -v` + rebuild), not just restart.
      - node_modules:/app/node_modules
    command: pnpm run dev

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Web UI, exposed to the host for manual inspection during dev.
      - "8025:8025"
    expose:
      # SMTP, internal — the app sends to mailpit:1025 over the compose network.
      - "1025"
    # No custom healthcheck needed: the official image ships one built in
    # (a native `readyz` subcommand), so `--wait mailpit` works as-is.

volumes:
  postgres_data:
  node_modules:
